# TEMPLATE. Copy to secret.yaml, replace every <placeholder>, apply, and do not
# commit the filled copy. (Or create the same Secret from your secret manager;
# the only contract is the name `skein-secrets` and the keys below.)
#
# How to generate the random values: INSTALL.md section 5.
#   SKEIN_INTERNAL_SECRET        openssl rand -hex 32   (the same value is used by
#                                skein-api and skein-web; at least 16 characters)
#   DATABASE_URL                 postgres://<user>:<password>@<host>:5432/<database>?sslmode=<mode>
#                                The database needs the pg_trgm and vector extensions and a
#                                non-C locale; see INSTALL.md, Target B.
#   REDIS_URL                    redis://[:<password>@]<host>:6379  (Redis must persist
#                                its data: it holds sessions and cookie keys)
#   S3_ACCESS_KEY, S3_SECRET_KEY the key of your S3 service for the attachments bucket
#   SKEIN_INITIAL_ADMIN_*        the first administrator. Used only while the database has no
#                                users; after the first sign-in remove both keys (and
#                                re-apply). Leave both out when users come from SSO.
apiVersion: v1
kind: Secret
metadata:
  name: skein-secrets
  labels:
    app.kubernetes.io/part-of: skein
type: Opaque
stringData:
  SKEIN_INTERNAL_SECRET: "<random, 32+ characters>"
  DATABASE_URL: "postgres://<user>:<password>@<postgres-host>:5432/<database>?sslmode=<disable|require|verify-full>"
  REDIS_URL: "redis://:<password>@<redis-host>:6379"
  S3_ACCESS_KEY: "<s3 access key>"
  S3_SECRET_KEY: "<s3 secret key>"
  SKEIN_INITIAL_ADMIN_EMAIL: "<admin email>"
  SKEIN_INITIAL_ADMIN_PASSWORD: "<generated password>"
