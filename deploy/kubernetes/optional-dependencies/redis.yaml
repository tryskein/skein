# EXAMPLE Redis-compatible store (Valkey, the BSD-licensed Redis fork) for
# trying Skein out. The Service and Secret keep the name `redis`: skein-web reads
# REDIS_URL and speaks the Redis protocol.
#
# NOT FOR PRODUCTION without more work: one instance, one volume, no TLS, no
# replica or failover. Keep what the application depends on:
#   - persistence (append-only file): Redis holds the browser sessions and the
#     cookie-encryption key ring of skein-web. A Redis that starts empty signs
#     every user out;
#   - a password (set from the Secret), because REDIS_URL carries it.
# Production: a managed Redis-compatible service or an operator with HA and
# persistence. Losing Redis loses no business data, only the sessions.
apiVersion: v1
kind: Service
metadata:
  name: skein-redis
  labels:
    app.kubernetes.io/name: skein-redis
    app.kubernetes.io/part-of: skein
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skein-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: skein-redis
  labels:
    app.kubernetes.io/name: skein-redis
    app.kubernetes.io/part-of: skein
spec:
  serviceName: skein-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skein-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skein-redis
        app.kubernetes.io/part-of: skein
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          # The image of docker-compose.production.yml, by digest.
          image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
          command:
            - sh
            - -c
            - exec valkey-server --appendonly yes --dir /data --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: {name: skein-optional-dependencies, key: REDIS_PASSWORD}
          ports:
            - name: redis
              containerPort: 6379
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli -a \"$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # storageClassName: <your-storage-class>   # the cluster default if omitted
        resources:
          requests:
            storage: 1Gi
