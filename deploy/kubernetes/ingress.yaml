# Routing for ingress-nginx: backend paths go straight to skein-web,
# everything else to skein-frontend. All three Deployments use two replicas.
# For Cilium Gateway API, use ../kubernetes-cilium/ instead of these Ingresses.
#
# WHAT YOU SET
#   - ingressClassName: the class of YOUR ingress-nginx controller (kubectl get
#     ingressclass). Both Ingresses use `nginx` below; change both if needed.
#   - host: the public host name (the same as in SKEIN_AGENT_PUBLIC_URL).
#   - TLS: terminate https here. skein-web needs X-Forwarded-Proto from the
#     controller to set the Secure flag of the session cookie; every common
#     controller sends it. The `tls` block names a Secret you provide (or one
#     your certificate manager fills).
#
# CONTROLLER-SPECIFIC SETTINGS. These annotations are for ingress-nginx.
# Another controller needs equivalent routing and cookie affinity; merely
# changing ingressClassName does not translate these annotations:
#   - /mcp and /agent/v1 stream: no response buffering, long read timeout;
#   - /hub: allow WebSocket upgrade and long-lived SSE/Long Polling requests;
#   - /hub: cookie affinity is required for the two skein-web replicas, with
#     reassignment when a backend fails (the second Ingress below).
#
# ALL paths listed for skein-web are needed. The agent API (/agent/v1) and the
# OAuth metadata documents must not fall through to skein-frontend: it would
# answer them with the HTML of the web UI (200 text/html) and agents would not
# work. /oauth2 is used only in the single sign-on modes.
apiVersion: v1
kind: Service
metadata:
  name: skein-web-hub
  labels:
    app.kubernetes.io/name: skein-web-hub
    app.kubernetes.io/part-of: skein
spec:
  # Same BFF pods as skein-web, with a separate ingress-nginx upstream so
  # its affinity settings do not depend on which Ingress was created first.
  selector:
    app.kubernetes.io/name: skein-web
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skein
  labels:
    app.kubernetes.io/name: skein
    app.kubernetes.io/part-of: skein
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [skein.example.com]
      secretName: <your-tls-secret>
  rules:
    - host: skein.example.com
      http:
        paths:
          - {path: /api, pathType: Prefix, backend: {service: {name: skein-web, port: {number: 8080}}}}
          - {path: /mcp, pathType: Prefix, backend: {service: {name: skein-web, port: {number: 8080}}}}
          - {path: /agent/v1, pathType: Prefix, backend: {service: {name: skein-web, port: {number: 8080}}}}
          - {path: /oauth2, pathType: Prefix, backend: {service: {name: skein-web, port: {number: 8080}}}}
          - {path: /.well-known/oauth-protected-resource, pathType: Prefix, backend: {service: {name: skein-web, port: {number: 8080}}}}
          - {path: /, pathType: Prefix, backend: {service: {name: skein-frontend, port: {number: 5102}}}}
---
# /hub has its own Ingress and Service so only SignalR requests use cookie
# affinity, independently of the other Ingress's upstream configuration.
# Negotiation and later transport requests must reach the same skein-web
# replica. The routing cookie is separate from the application's auth cookie.
# On backend failure, change the routing cookie so the client can reconnect
# to another replica. Redis continues to share sessions and hub messages.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: skein-hub
  labels:
    app.kubernetes.io/name: skein
    app.kubernetes.io/part-of: skein
  annotations:
    nginx.ingress.kubernetes.io/affinity: "cookie"
    nginx.ingress.kubernetes.io/affinity-mode: "persistent"
    nginx.ingress.kubernetes.io/session-cookie-name: "skein-hub"
    nginx.ingress.kubernetes.io/session-cookie-path: "/hub"
    nginx.ingress.kubernetes.io/session-cookie-samesite: "Lax"
    nginx.ingress.kubernetes.io/session-cookie-secure: "true"
    nginx.ingress.kubernetes.io/session-cookie-change-on-failure: "true"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [skein.example.com]
      secretName: <your-tls-secret>
  rules:
    - host: skein.example.com
      http:
        paths:
          - {path: /hub, pathType: Prefix, backend: {service: {name: skein-web-hub, port: {number: 8080}}}}
