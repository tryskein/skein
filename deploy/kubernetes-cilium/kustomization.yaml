# Cilium Gateway API routing alternative. Configure the base application's
# images, ConfigMaps and Secrets in ../kubernetes as usual, then apply this
# directory instead. The Ingresses and their dedicated hub Service are omitted;
# the Deployments, application Services and PodDisruptionBudgets share the base.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../kubernetes
  - gateway.yaml
  - httproute.yaml
patches:
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: skein-web-hub
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: skein
  - patch: |-
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata:
        name: skein-hub
